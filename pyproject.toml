[project]
name = "pacer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "hypothesis>=6.170.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "testcontainers[postgres,redis]>=4.15.0",
]



[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP', 'ASYNC', 'S']
ignore = ['S101']

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['S105', 'S106']

[tool.mypy]
python_version = '3.12'
strict = true
plugins = ['pydantic.mypy']

[[tool.mypy.overrides]]
module = ['testcontainers.*', 'argon2.*']
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
pythonpath = ['.']
